<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>decision-tree - demo</title>
    <style>
      :root {
        --main-bg: #f8f7f5;
        --main-bg-elevated: #efeeec;
        --surface: #ffffff;
        --text-primary: #1a1816;
        --text-secondary: #5a5450;
        --text-tertiary: #8a8278;
        --text-quaternary: #b3ada3;
        --border-tertiary: rgba(26, 24, 22, 0.06);
        --border-secondary: rgba(26, 24, 22, 0.12);
        --border-strong: rgba(26, 24, 22, 0.18);
        --info-bg: rgba(70, 100, 180, 0.1);
        --info-text: #3a5da3;
        --info-border: rgba(70, 100, 180, 0.25);
        --send-btn-bg: #c75e3c;
        --branch-active-border: #534ab7;
        --branch-active-bg: #eeedfe;
        --branch-active-text: #26215c;
        --branch-committed-border: #3b6d11;
        --branch-committed-bg: #eaf3de;
        --branch-committed-text: #173404;
        --font-serif: 'Charter', 'Iowan Old Style', 'Source Serif Pro', 'Georgia', serif;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Inter', system-ui, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
        color: var(--text-primary);
        background: var(--main-bg);
      }

      .app {
        display: flex;
        height: 100vh;
      }

      .main {
        flex: 1;
        background: var(--main-bg);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .title-bar {
        padding: 12px 24px;
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
        height: 48px;
        flex-shrink: 0;
      }
      .title-bar .title-text {
        font-weight: 500;
        color: var(--text-primary);
      }
      .title-bar .chevron {
        width: 12px;
        height: 12px;
        color: var(--text-tertiary);
      }

      .chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 24px 64px 16px;
        scroll-behavior: smooth;
      }
      .chat-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .chat-scroll::-webkit-scrollbar-thumb {
        background: rgba(31, 29, 26, 0.12);
        border-radius: 4px;
      }
      .chat-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .chat-inner {
        max-width: 740px;
        margin: 0 auto;
      }

      .user-message {
        font-family: var(--font-serif);
        font-size: 17px;
        line-height: 1.55;
        color: var(--text-primary);
        background: var(--main-bg-elevated);
        border-radius: 14px;
        padding: 12px 18px;
        margin: 0 0 28px auto;
        max-width: 80%;
        width: fit-content;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      .user-message.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .thought {
        margin: 0 0 20px;
        font-family: var(--font-sans);
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      .thought.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .thought-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text-secondary);
        padding: 4px 0 12px;
        font-style: italic;
      }
      .thought-header .chevron-down {
        width: 12px;
        height: 12px;
        color: var(--text-tertiary);
        transform: rotate(180deg);
        font-style: normal;
      }

      .thinking-list {
        padding-left: 4px;
      }
      .thinking {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 6px 0;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.5;
        font-style: italic;
        opacity: 0;
        transform: translateY(3px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      .thinking.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .thinking .icon {
        width: 14px;
        height: 14px;
        margin-top: 4px;
        flex-shrink: 0;
        color: var(--text-tertiary);
        font-style: normal;
      }
      .thinking.done {
        color: var(--text-secondary);
        font-style: normal;
      }
      .thinking.done .icon {
        color: var(--text-secondary);
      }

      .nav {
        padding: 4px 0 8px;
        font-family: var(--font-sans);
        color: var(--text-primary);
        opacity: 0;
        transition: opacity 0.5s ease;
        margin-bottom: 16px;
      }
      .nav.visible {
        opacity: 1;
      }
      .nav-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .nav-header .icon {
        width: 18px;
        height: 18px;
        color: var(--text-secondary);
      }
      .nav-header h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .nav-sub {
        font-size: 13px;
        color: var(--text-secondary);
        margin: 0 0 1.25rem;
      }

      .lv {
        margin-bottom: 1rem;
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        transition:
          opacity 0.4s ease,
          max-height 0.5s ease;
      }
      .lv.visible {
        opacity: 1;
        max-height: 600px;
      }
      .lv.indent {
        border-left: 2px solid var(--branch-active-border);
        padding-left: 14px;
        margin-left: 4px;
      }
      .lm {
        font-size: 11px;
        color: var(--text-tertiary);
        margin-bottom: 6px;
        letter-spacing: 0.4px;
        font-weight: 500;
        font-family: var(--font-mono);
      }
      .lq {
        font-size: 15px;
        font-weight: 500;
        margin: 0 0 4px;
        color: var(--text-primary);
      }
      .lbasis {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-bottom: 12px;
        font-style: italic;
      }

      .bg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .b {
        background: var(--surface);
        border: 0.5px solid var(--border-tertiary);
        border-radius: 12px;
        padding: 12px 14px;
        text-align: left;
        font: inherit;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
        cursor: default;
      }
      .b.hovered {
        border-color: var(--border-secondary);
      }
      .b.active {
        border-color: var(--branch-active-border);
        background: var(--branch-active-bg);
      }
      .b.dim {
        opacity: 0.5;
      }
      .b.committed {
        border-color: var(--branch-committed-border);
        background: var(--branch-committed-bg);
      }
      .bt {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .b.active .bt {
        color: var(--branch-active-text);
      }
      .b.committed .bt {
        color: var(--branch-committed-text);
      }
      .bs {
        font-size: 12.5px;
        color: var(--text-secondary);
        line-height: 1.45;
      }
      .bp {
        font-size: 11.5px;
        color: var(--text-tertiary);
        border-top: 0.5px dashed var(--border-tertiary);
        padding-top: 8px;
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .bn {
        font-size: 12px;
        color: var(--branch-active-border);
        background: var(--branch-active-bg);
        padding: 6px 8px;
        border-radius: 6px;
        font-style: italic;
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        transition:
          opacity 0.3s ease,
          max-height 0.3s ease;
      }
      .bn.visible {
        opacity: 1;
        max-height: 60px;
      }
      .ni-wrap {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .ni-wrap.open {
        max-height: 60px;
      }
      .ni {
        width: 100%;
        font: inherit;
        font-size: 12px;
        padding: 6px 8px;
        border: 0.5px solid var(--branch-active-border);
        box-shadow: 0 0 0 1px var(--branch-active-bg);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text-primary);
        resize: none;
        min-height: 36px;
        outline: none;
        font-family: var(--font-sans);
      }
      .nb {
        background: none;
        border: none;
        color: var(--text-tertiary);
        font-size: 11.5px;
        padding: 0;
        text-align: left;
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .cr {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
        padding: 12px 14px;
        background: var(--main-bg-elevated);
        border-radius: 8px;
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        transition:
          opacity 0.35s ease,
          max-height 0.35s ease;
      }
      .cr.visible {
        opacity: 1;
        max-height: 80px;
      }
      .cr.sent {
        background: var(--branch-committed-bg);
      }
      .cr .flag {
        width: 18px;
        height: 18px;
        color: var(--branch-committed-border);
        flex-shrink: 0;
      }
      .cr .msg {
        flex: 1;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .cr.sent .msg {
        color: var(--branch-committed-text);
        font-weight: 500;
      }
      .cr .commit-btn {
        font-size: 13px;
        padding: 6px 14px;
        background: transparent;
        color: var(--branch-active-border);
        border: 0.5px solid var(--branch-active-border);
        border-radius: 8px;
        font-weight: 500;
        font-family: var(--font-sans);
        transition: transform 0.15s ease;
      }
      .cr .commit-btn.clicked {
        transform: scale(0.96);
      }

      /* Input bar (Claude chrome) */
      .input-bar {
        padding: 0 64px 4px;
        background: var(--main-bg);
        flex-shrink: 0;
      }
      .input-bar-inner {
        max-width: 740px;
        margin: 0 auto;
        background: var(--surface);
        border-radius: 20px;
        padding: 14px 18px 10px;
        box-shadow:
          0 1px 3px rgba(31, 29, 26, 0.06),
          0 1px 2px rgba(31, 29, 26, 0.04);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 88px;
      }
      .input-text {
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.5;
        min-height: 24px;
        padding: 2px 0;
      }
      .input-text.empty::before {
        content: 'Write a message...';
        color: var(--text-quaternary);
      }
      .input-text .caret {
        display: inline-block;
        width: 1px;
        height: 18px;
        background: var(--text-primary);
        margin-left: 1px;
        vertical-align: -4px;
        animation: blink 1s steps(2) infinite;
      }
      .input-text.empty .caret {
        display: none;
      }
      @keyframes blink {
        0%,
        50% {
          opacity: 1;
        }
        50.01%,
        100% {
          opacity: 0;
        }
      }

      .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .input-actions .left,
      .input-actions .right {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .input-actions .icon-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        color: var(--text-tertiary);
      }
      .input-actions .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .input-actions .model-info {
        display: flex;
        align-items: center;
        font-size: 13px;
        color: var(--text-secondary);
        padding: 4px 8px;
        gap: 8px;
      }
      .input-actions .model-info .divider {
        width: 1px;
        height: 12px;
        background: var(--border-secondary);
      }
      .input-actions .send-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--send-btn-bg);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: 4px;
        transition:
          background 0.2s,
          transform 0.15s ease;
      }
      .input-actions .send-btn.clicked {
        transform: scale(0.9);
      }
      .input-actions .send-btn svg {
        width: 14px;
        height: 14px;
      }

      .footer-disclaimer {
        text-align: center;
        font-size: 11px;
        color: var(--text-tertiary);
        padding: 6px 0 10px;
        background: var(--main-bg);
      }

      .cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 22px;
        height: 22px;
        pointer-events: none;
        z-index: 1000;
        transition:
          transform 0.55s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.3s ease;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.18));
      }
      .cursor svg {
        display: block;
      }
      .cursor.hidden {
        opacity: 0;
      }
      .cursor.clicking::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 4px;
        width: 16px;
        height: 16px;
        border: 2px solid var(--branch-active-border);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: pulse-ring 0.5s ease-out;
      }
      @keyframes pulse-ring {
        0% {
          transform: translate(-50%, -50%) scale(0.4);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(2.5);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main">
        <div class="title-bar">
          <span class="title-text">Auth strategy for a weekend side project</span>
          <svg class="chevron" viewBox="0 0 12 12" fill="none">
            <path
              d="M3 4.5l3 3 3-3"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <div class="chat-scroll" id="chatScroll">
          <div class="chat-inner" id="chat"></div>
        </div>

        <div class="input-bar">
          <div class="input-bar-inner">
            <div class="input-text empty" id="inputText">
              <span class="text"></span><span class="caret"></span>
            </div>
            <div class="input-actions">
              <div class="left">
                <div class="icon-btn">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path
                      d="M8 3v10M3 8h10"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linecap="round"
                    />
                  </svg>
                </div>
              </div>
              <div class="right">
                <div class="model-info">
                  <span class="label">Opus 4.7</span>
                  <span class="divider"></span>
                  <span class="label">Adaptive</span>
                  <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                    <path
                      d="M3 4.5l3 3 3-3"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div class="icon-btn">
                  <svg viewBox="0 0 16 16" fill="none">
                    <rect
                      x="6"
                      y="2.5"
                      width="4"
                      height="8"
                      rx="2"
                      stroke="currentColor"
                      stroke-width="1.2"
                    />
                    <path
                      d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5V14"
                      stroke="currentColor"
                      stroke-width="1.2"
                      stroke-linecap="round"
                    />
                  </svg>
                </div>
                <div class="send-btn" id="sendBtn">
                  <svg viewBox="0 0 16 16" fill="none">
                    <path
                      d="M8 13V3M4 7l4-4 4 4"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="footer-disclaimer">
          Claude is AI and can make mistakes. Please double-check responses.
        </div>
      </main>
    </div>

    <div class="cursor hidden" id="cursor">
      <svg
        width="22"
        height="22"
        viewBox="0 0 22 22"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M3 2L3 17L7.5 13L9.5 18L11.5 17.2L9.5 12.5L15 12.5L3 2Z"
          fill="#1f1d1a"
          stroke="white"
          stroke-width="1"
        />
      </svg>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const chatScroll = document.getElementById('chatScroll');
      const inputText = document.getElementById('inputText');
      const inputTextSpan = inputText.querySelector('.text');
      const cursor = document.getElementById('cursor');
      const sendBtn = document.getElementById('sendBtn');

      const PROMPT =
        "I'm starting a side project this weekend. Help me think through what auth to use.";

      const THOUGHT_SUMMARY = 'Generated decision tree for auth strategy';

      const THINKING_STATES = [
        {
          text: 'The user wants help picking auth - that’s a branching decision with real trade-offs. Good fit for the decision-tree skill.',
        },
        {
          text: 'Running the variance check internally: "ship fast", "max flexibility", "team-ready" lead to genuinely different next-questions, not the same question with filters. Tree fits.',
        },
        {
          text: 'Reading the widget template for decision-tree and the schema.',
        },
        {
          text: 'Generating the tree: 3 levels deep, 3 branches at each level. Every L2 leaf is a named approach - no "your choice of provider".',
        },
        { text: 'Done', done: true },
      ];

      const ICON_DOC = `<svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M3 2h7l3 3v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.2"/><path d="M10 2v3h3" stroke="currentColor" stroke-width="1.2"/></svg>`;
      const ICON_CHECK = `<svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const ICON_BRANCH = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 8v8M18 8c0 6-12 4-12 10"/></svg>`;
      const ICON_FLAG = `<svg class="flag" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v12M3 3h8l-1.5 3L11 9H3"/></svg>`;
      const ICON_CHECK_LG = `<svg class="flag" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>`;
      const ICON_PLUS_SM = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>`;
      const ICON_NOTE_SM = `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7l3 3v7H3z"/></svg>`;
      const ICON_NEXT = `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l4 4-4 4M9 4l4 4-4 4"/></svg>`;

      const LEVELS = [
        {
          label: 'DECISION 1 OF 3',
          question: 'What matters most for this auth setup?',
          basis: 'The trade you make here drives every downstream choice.',
          branches: [
            {
              id: 'effort-now',
              title: 'Ship the MVP this week',
              summary: 'Off-the-shelf provider, sensible defaults, zero infra to babysit.',
              next: 'which managed provider fits the stack',
            },
            {
              id: 'control-later',
              title: 'Max flexibility long-term',
              summary: 'Own the session model so you can swap providers or self-host later.',
              next: 'core trust model',
            },
            {
              id: 'team-scale',
              title: 'Ready for contributors',
              summary: 'Built for an eventual team - roles, audit trails, org boundaries.',
              next: 'org boundary shape',
            },
          ],
        },
        {
          label: 'DECISION 2 OF 3',
          question: 'Which managed provider fits the stack?',
          basis: 'You’re shipping this week - pick on integration speed, not feature ceiling.',
          branches: [
            {
              id: 'clerk',
              title: 'Clerk hosted auth',
              summary: 'Drop-in React components, generous free tier, social + email handled.',
              next: 'sign-in surface area',
            },
            {
              id: 'supabase',
              title: 'Supabase Auth',
              summary: 'Bundled with the rest of your Supabase project - one less vendor.',
              next: 'sign-in surface area',
            },
            {
              id: 'auth0',
              title: 'Auth0 free tier',
              summary: 'Mature, enterprise-ready, but heavier setup than the others.',
              next: 'sign-in surface area',
            },
          ],
        },
        {
          label: 'DECISION 3 OF 3 (FINAL)',
          question: 'Which sign-in surface do you want?',
          basis: 'Each option costs the same to implement with Clerk - choice is mostly UX.',
          branches: [
            {
              id: 'email-pw',
              title: 'Email + password',
              summary: 'Classic. Clerk handles reset flows and breach checks out of the box.',
            },
            {
              id: 'social-only',
              title: 'Social sign-in only',
              summary: 'GitHub + Google buttons via Clerk. Zero password UX to design.',
            },
            {
              id: 'magic-link',
              title: 'Magic link',
              summary: 'Passwordless email link via Clerk. Lowest friction for a side project.',
            },
          ],
        },
      ];

      const WALK = [
        { level: 0, branch: 'effort-now' },
        { level: 1, branch: 'clerk' },
        { level: 2, branch: 'social-only' },
      ];

      const NOTE = { branch: 'social-only', text: 'only need GitHub for now' };

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const getCenter = (el) => {
        const rect = el.getBoundingClientRect();
        return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      };

      const scrollToBottom = (smooth = true) => {
        chatScroll.scrollTo({
          top: chatScroll.scrollHeight,
          behavior: smooth ? 'smooth' : 'auto',
        });
      };

      const moveCursorTo = (target, offsetX = 0, offsetY = 0) => {
        const center = getCenter(target);
        cursor.style.transform = `translate(${center.x + offsetX - 4}px, ${center.y + offsetY - 4}px)`;
      };

      const clickCursor = async () => {
        cursor.classList.add('clicking');
        await sleep(500);
        cursor.classList.remove('clicking');
      };

      const typeIntoInput = async (text, speed = 26) => {
        inputText.classList.remove('empty');
        inputTextSpan.textContent = '';
        await text.split('').reduce(async (chain, ch) => {
          await chain;
          inputTextSpan.textContent += ch;
          await sleep(speed);
        }, Promise.resolve());
      };

      const typeInto = async (el, text, speed = 32) => {
        el.textContent = '';
        await text.split('').reduce(async (chain, ch) => {
          await chain;
          el.textContent += ch;
          await sleep(speed);
        }, Promise.resolve());
      };

      const clearChat = () => {
        chat.innerHTML = '';
        chatScroll.scrollTop = 0;
      };

      const renderUserMessage = (text) => {
        const div = document.createElement('div');
        div.className = 'user-message';
        div.textContent = text;
        chat.appendChild(div);
        requestAnimationFrame(() => {
          div.classList.add('visible');
          scrollToBottom();
        });
      };

      const renderThoughtContainer = () => {
        const wrap = document.createElement('div');
        wrap.className = 'thought';
        wrap.innerHTML = `
          <div class="thought-header">
            <svg class="chevron-down" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>${THOUGHT_SUMMARY}</span>
          </div>
          <div class="thinking-list"></div>
        `;
        chat.appendChild(wrap);
        requestAnimationFrame(() => {
          wrap.classList.add('visible');
          scrollToBottom();
        });
        return wrap.querySelector('.thinking-list');
      };

      const renderThinkingState = (state) => {
        const div = document.createElement('div');
        div.className = 'thinking' + (state.done ? ' done' : '');
        div.innerHTML = `${state.done ? ICON_CHECK : ICON_DOC}<span>${state.text}</span>`;
        return div;
      };

      const renderNav = () => {
        const nav = document.createElement('div');
        nav.className = 'nav';
        nav.id = 'nav';
        nav.innerHTML = `
          <div class="nav-header">
            <span class="icon">${ICON_BRANCH}</span>
            <h3>Decision navigator</h3>
          </div>
          <p class="nav-sub">authentication strategy. Walk to a leaf, then commit and the brief sends back to chat.</p>
          <div id="tree-wrap"></div>
        `;
        chat.appendChild(nav);
        requestAnimationFrame(() => {
          nav.classList.add('visible');
          scrollToBottom();
        });
        return nav;
      };

      const renderLevel = (levelIndex) => {
        const level = LEVELS[levelIndex];
        const wrap = document.createElement('div');
        wrap.className = 'lv' + (levelIndex > 0 ? ' indent' : '');
        wrap.dataset.level = String(levelIndex);
        const branchesHtml = level.branches
          .map((branch) => {
            const hint =
              levelIndex < 2
                ? `<div class="bp">${ICON_NEXT}<span>next: ${branch.next}</span></div>`
                : '';
            return `
              <div class="b" data-id="${branch.id}">
                <div class="bt">${branch.title}</div>
                <div class="bs">${branch.summary}</div>
                <div class="bn" data-note-for="${branch.id}"></div>
                <div class="ni-wrap"><textarea class="ni" data-input-for="${branch.id}" rows="2"></textarea></div>
                ${hint}
                <button class="nb" data-add-note-for="${branch.id}">${ICON_PLUS_SM}<span>add note</span></button>
              </div>
            `;
          })
          .join('');
        wrap.innerHTML = `
          <div class="lm">${level.label}</div>
          <h4 class="lq">${level.question}</h4>
          <div class="lbasis">${level.basis}</div>
          <div class="bg">${branchesHtml}</div>
        `;
        document.getElementById('tree-wrap').appendChild(wrap);
        requestAnimationFrame(() => {
          wrap.classList.add('visible');
          scrollToBottom();
        });
        return wrap;
      };

      const markActive = (levelEl, branchId) => {
        const branches = levelEl.querySelectorAll('.b');
        branches.forEach((branch) => {
          if (branch.dataset.id === branchId) {
            branch.classList.add('active');
            branch.classList.remove('dim');
          } else {
            branch.classList.add('dim');
            branch.classList.remove('active');
          }
        });
      };

      const markCommitted = (levelEl, branchId) => {
        const branches = levelEl.querySelectorAll('.b');
        branches.forEach((branch) => {
          if (branch.dataset.id === branchId) {
            branch.classList.add('committed');
            branch.classList.remove('active');
          }
        });
      };

      const renderCommitRow = (treeWrap) => {
        const row = document.createElement('div');
        row.className = 'cr';
        row.id = 'commit-row';
        row.innerHTML = `
          ${ICON_FLAG}
          <div class="msg">Lock this in and send the brief to chat?</div>
          <button class="commit-btn">Commit and send ↗</button>
        `;
        treeWrap.appendChild(row);
        requestAnimationFrame(() => {
          row.classList.add('visible');
          scrollToBottom();
        });
        return row;
      };

      const transformCommitRowToSent = (row) => {
        row.classList.add('sent');
        row.innerHTML = `${ICON_CHECK_LG}<div class="msg">Sent to chat</div>`;
        scrollToBottom();
      };

      const runSequence = async () => {
        clearChat();
        inputText.classList.add('empty');
        inputTextSpan.textContent = '';
        cursor.classList.add('hidden');

        await sleep(900);
        await typeIntoInput(PROMPT);
        await sleep(500);

        sendBtn.classList.add('clicked');
        await sleep(140);
        sendBtn.classList.remove('clicked');
        inputText.classList.add('empty');
        inputTextSpan.textContent = '';
        renderUserMessage(PROMPT);
        await sleep(800);

        const list = renderThoughtContainer();
        await THINKING_STATES.reduce(async (chain, state) => {
          await chain;
          const el = renderThinkingState(state);
          list.appendChild(el);
          requestAnimationFrame(() => {
            el.classList.add('visible');
            scrollToBottom();
          });
          await sleep(state.done ? 700 : 900);
        }, Promise.resolve());
        await sleep(400);

        renderNav();
        await sleep(400);
        const level0 = renderLevel(0);
        await sleep(900);

        cursor.style.transform = `translate(${window.innerWidth - 100}px, ${window.innerHeight - 50}px)`;
        cursor.classList.remove('hidden');
        await sleep(400);

        // L0 click
        const branch0 = level0.querySelector(`[data-id="${WALK[0].branch}"]`);
        moveCursorTo(branch0, -30, -10);
        await sleep(650);
        branch0.classList.add('hovered');
        await sleep(280);
        moveCursorTo(branch0, 0, 0);
        await sleep(350);
        await clickCursor();
        branch0.classList.remove('hovered');
        markActive(level0, WALK[0].branch);
        await sleep(550);

        const level1 = renderLevel(1);
        await sleep(700);
        scrollToBottom();
        await sleep(300);

        // L1 click
        const branch1 = level1.querySelector(`[data-id="${WALK[1].branch}"]`);
        moveCursorTo(branch1, 0, -10);
        await sleep(700);
        branch1.classList.add('hovered');
        await sleep(280);
        moveCursorTo(branch1, 0, 0);
        await sleep(280);
        await clickCursor();
        branch1.classList.remove('hovered');
        markActive(level1, WALK[1].branch);
        await sleep(550);

        const level2 = renderLevel(2);
        await sleep(700);
        scrollToBottom();
        await sleep(300);

        // L2 add note before committing
        const branch2 = level2.querySelector(`[data-id="${WALK[2].branch}"]`);
        const addNoteBtn = branch2.querySelector(`[data-add-note-for="${WALK[2].branch}"]`);
        moveCursorTo(addNoteBtn, 0, 0);
        await sleep(650);
        await clickCursor();
        const noteWrap = branch2.querySelector('.ni-wrap');
        const noteInput = branch2.querySelector(`[data-input-for="${WALK[2].branch}"]`);
        const noteBadge = branch2.querySelector(`[data-note-for="${WALK[2].branch}"]`);
        addNoteBtn.style.display = 'none';
        noteWrap.classList.add('open');
        await sleep(400);
        await typeInto(noteInput, NOTE.text);
        await sleep(550);
        // commit note -> hide textarea, show badge
        noteWrap.classList.remove('open');
        noteBadge.innerHTML = `${ICON_NOTE_SM}<span style="margin-left:4px;">${NOTE.text}</span>`;
        noteBadge.classList.add('visible');
        await sleep(450);

        // L2 click - select leaf
        moveCursorTo(branch2, 0, -20);
        await sleep(550);
        branch2.classList.add('hovered');
        await sleep(280);
        await clickCursor();
        branch2.classList.remove('hovered');
        markActive(level2, WALK[2].branch);
        await sleep(550);

        // Commit row appears
        const treeWrap = document.getElementById('tree-wrap');
        const commitRow = renderCommitRow(treeWrap);
        await sleep(700);

        const commitBtn = commitRow.querySelector('.commit-btn');
        moveCursorTo(commitBtn, 0, -6);
        await sleep(700);
        await clickCursor();
        commitBtn.classList.add('clicked');
        await sleep(200);
        commitBtn.classList.remove('clicked');

        // Commit: turn last branch green, swap commit row to "Sent"
        markCommitted(level2, WALK[2].branch);
        transformCommitRowToSent(commitRow);
        cursor.classList.add('hidden');
        await sleep(5000);

        runSequence();
      };

      setTimeout(runSequence, 300);
    </script>
  </body>
</html>
